# Builds an UNSIGNED .ipa on a GitHub macOS runner.
# The device owner signs and installs it from Windows with Sideloadly,
# using their own free Apple ID (re-install every 7 days).
name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DriveAgent.xcodeproj \
            -scheme DriveAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/DriveAgent.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DriveAgent.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveAgent-ipa
          path: DriveAgent.ipa
          retention-days: 14

      - name: Show compile errors
        if: failure()
        run: grep -E "error:|ld:|Undefined symbols" build.log | sort -u | head -n 60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
